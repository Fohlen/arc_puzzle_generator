[project]
name = "arc_puzzle_generator"
version = "0.0.7"
authors = [
    { name = "Lennard Berger", email = "3730888+Fohlen@users.noreply.github.com" },
]
description = "A generator for ARC-AGI 2 type puzzles"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

dependencies = [
    "numpy~=1.26.4"
]

[project.optional-dependencies]
vis = [
    "matplotlib~=3.7.2"
]

dev = [
    "mypy==1.17.1"
]

[project.scripts]
arc-visualize = "arc_puzzle_generator.visualization:main"

#[project.urls]
#Homepage = "https://github.com/pypa/sampleproject"
#Issues = "https://github.com/pypa/sampleproject/issues"

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"arc_puzzle_generator" = ["py.typed"]

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true
